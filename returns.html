<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- B13(2026-10-05): 退换与售后静态成文——香港席"查退换"一步全灭的风险路径补上。
         口径与购物袋信任行（cart.js"含运费 · 30 天可退"）一字不差同源。 -->
    <title>退换与售后 - Reich</title>
    <meta name="description" content="Reich 退换政策：30 天可退，来回运费我们担。演示站说明一并写在明处。">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- 样式（与 orders 页同栈的静页子集） -->
    <link rel="preload" href="fonts/barlow-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components/site-header.css">
    <link rel="stylesheet" href="css/components/nav-underline.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tailwind-entry.css">
</head>

<body class="text-[var(--text-primary)]" style="padding-top: 72px">
    <!-- 跳转到主内容链接 (无障碍性) -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-[var(--ink)] text-white px-4 py-2 rounded z-50">跳转到主内容</a>

    <!-- 统一站点导航（js/site-header.js 按 PAGE_CONFIG=renders 渲染；JS 关闭时 noscript 兜底） -->
    <noscript>
      <header class="site-header" id="siteHeader">
        <div class="container mx-auto px-4 site-header-inner">
        <nav aria-label="主导航">
          <ul class="site-nav">
            <li><a href="index.html#featured-collections">手袋</a></li>
            <li><a href="index.html#brand-story">品牌故事</a></li>
          </ul>
        </nav>
        <a href="index.html" class="site-brand">REICH</a>
        <div class="site-tools">
          <a href="login.html" aria-label="账户">账户</a>
        </div>
        </div>
      </header>
    </noscript>
    <template data-site-header data-page="returns"></template>
    <script type="module" src="js/site-header.js"></script>

    <!-- 主内容区 -->
    <main id="main-content" role="main">
        <section class="bg-white py-8 border-b border-[var(--border-default)]">
            <div class="container mx-auto px-4">
                <h1 class="text-3xl font-bold">退换与售后</h1>
                <p class="text-[var(--ink-soft)] mt-2">写得明明白白，买错了也不慌。</p>
            </div>
        </section>

        <section class="py-12">
            <div class="container mx-auto px-4 max-w-2xl space-y-10">
                <div>
                    <h2 class="text-xl font-bold mb-3">30 天可退</h2>
                    <p class="text-[var(--ink-soft)] leading-relaxed">
                        从收到包那天算起，30 天内都可以退。吊牌还在、包没背出门、不影响二次销售就行——
                        用不用得上这条政策，都由你决定，我们不会追问理由。
                    </p>
                </div>

                <div>
                    <h2 class="text-xl font-bold mb-3">来回运费，我们担</h2>
                    <p class="text-[var(--ink-soft)] leading-relaxed">
                        退货的运费两头都算我们的：寄来的运费已含在价里，寄回的运费由我们承担。
                        退款在收到退货后原路退回，一般 3-5 个工作日到账。
                    </p>
                </div>

                <div>
                    <h2 class="text-xl font-bold mb-3">这是演示站</h2>
                    <p class="text-[var(--ink-soft)] leading-relaxed">
                        本站是演示项目：结算通道未开通，上面的政策是上线时的正式口径。
                        正式营业后，客服邮箱与电话会补在这个页面——现在写下的是承诺，不是话术。
                    </p>
                </div>

                <div class="pt-6 border-t border-[var(--line)]">
                    <a href="index.html" class="text-[var(--candy-blush-ink)] focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">← 回去继续逛</a>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚（与全站一致的极简版） -->
    <footer class="border-t border-[var(--line)] py-8 mt-8">
        <div class="container mx-auto px-4 text-sm text-[var(--ink-soft)]">
            <p>&copy; 2026 Reich. 保留所有权利。</p>
        </div>
    </footer>
</body>

</html>
