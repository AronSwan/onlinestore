<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - Reich 购物网站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- CSS变量系统 + 主样式表 + 个人资料页样式 -->
    <link rel="preload" href="fonts/barlow-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components/site-header.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/profile.css">
    <!-- escapeHtml 全局工具：经典脚本按序执行，必须先于 profile-manager.js（其渲染依赖它） -->
    <script src="js/utils/escape-html.js"></script>
    <script src="js/profile-manager.js"></script>
</head>
<body style="padding-top: 72px">
    <!-- 统一站点导航（P3：模板 _header-template.html，替换旧 .navbar/.nav-container 自研导航） -->
    <header class="site-header" id="siteHeader">
      <nav aria-label="主导航">
        <ul class="site-nav">
          <li><a href="index.html">女士</a></li>
          <li><a href="index.html">男士</a></li>
          <li><a href="index.html">配饰</a></li>
        </ul>
      </nav>

      <a href="index.html" class="site-brand">REICH</a>

      <div class="site-tools">
        <!-- 搜索 -->
        <button type="button" id="searchBtn" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>

        <!-- 心愿单 -->
        <a href="index.html" aria-label="心愿单" class="site-wishlist-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.8-9.8-9.2C.6 8.8 2.5 5 6.1 5c2 0 3.4 1 4.4 2.5h3C14.5 6 15.9 5 17.9 5c3.6 0 5.5 3.8 3.9 6.8C19.5 16.2 12 21 12 21z" fill="none"/></svg>
        </a>

        <!-- 用户（当前页=个人中心） -->
        <a href="profile.html" aria-label="账户" class="site-user-btn" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3.6-6 7-6s7 2 7 6"/></svg>
        </a>

        <!-- 购物车（cart.js 绑定 data-cart-icon） -->
        <button type="button" data-cart-icon="true" aria-label="购物车" class="site-cart-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1.5 12h-9L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="site-cart-badge" id="cart-badge" style="display: none;">0</span>
        </button>

        <!-- 汉堡（移动端） -->
        <button type="button" class="site-burger" id="mobileMenuBtn" aria-label="菜单" aria-expanded="false" aria-controls="mobileMenu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <!-- 移动菜单（与 id=mobileMenu 冻结契约一致） -->
    <nav class="site-mobile-menu" id="mobileMenu" aria-label="移动导航">
      <ul>
        <li><a href="index.html">女士</a></li>
        <li><a href="index.html">男士</a></li>
        <li><a href="index.html">配饰</a></li>
        <li><a href="orders.html">订单</a></li>
        <li><a href="login.html">登录 / 注册</a></li>
      </ul>
    </nav>

    <!-- 主要内容区域 -->
    <main class="profile-container">
        <div class="profile-sidebar">
            <h2>个人中心</h2>
            <ul class="profile-menu">
                <li><a href="#basic-info" class="active">基本信息</a></li>
                <li><a href="#addresses">收货地址</a></li>
                <li><a href="#security">账户安全</a></li>
                <li><a href="#preferences">偏好设置</a></li>
            </ul>
        </div>

        <div class="profile-content">
            <!-- 基本信息部分 -->
            <section id="basic-info" class="profile-section active">
                <h2>基本信息</h2>
                <form id="basic-info-form" class="profile-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" readonly>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input type="email" id="email" name="email" readonly>
                    </div>
                    <div class="form-group">
                        <label for="phone">手机号码</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="nickname">昵称</label>
                        <input type="text" id="nickname" name="nickname">
                    </div>
                    <div class="form-group">
                        <label for="birthday">生日</label>
                        <input type="date" id="birthday" name="birthday">
                    </div>
                    <div class="form-group">
                        <label for="gender">性别</label>
                        <select id="gender" name="gender">
                            <option value="">请选择</option>
                            <option value="male">男</option>
                            <option value="female">女</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">保存修改</button>
                </form>
            </section>

            <!-- 收货地址部分 -->
            <section id="addresses" class="profile-section">
                <h2>收货地址管理</h2>
                <div class="address-header">
                    <button id="add-address-btn" class="btn-primary">添加新地址</button>
                </div>
                <div id="addresses-list" class="addresses-list">
                    <!-- 地址列表将通过JavaScript动态加载 -->
                </div>
            </section>

            <!-- 账户安全部分 -->
            <section id="security" class="profile-section">
                <h2>账户安全</h2>
                <div class="security-options">
                    <div class="security-item">
                        <h3>修改密码</h3>
                        <button id="change-password-btn" class="btn-secondary">修改密码</button>
                    </div>
                    <div class="security-item">
                        <h3>登录记录</h3>
                        <button id="view-login-history" class="btn-secondary">查看记录</button>
                    </div>
                </div>
            </section>

            <!-- 偏好设置部分 -->
            <section id="preferences" class="profile-section">
                <h2>偏好设置</h2>
                <form id="preferences-form" class="profile-form">
                    <div class="form-group">
                        <label for="language">语言偏好</label>
                        <select id="language" name="language">
                            <option value="zh-CN">简体中文</option>
                            <option value="en-US">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="currency">货币单位</label>
                        <select id="currency" name="currency">
                            <option value="CNY">人民币 (CNY)</option>
                            <option value="USD">美元 (USD)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <span>订阅新品来信（真的偶尔）</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="sms-notifications" name="sms-notifications">
                            <span>短信通知</span>
                        </label>
                    </div>
                    <button type="submit" class="btn-primary">保存设置</button>
                </form>
            </section>
        </div>
    </main>

    <!-- 地址编辑模态框 -->
    <div id="address-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="address-modal-title">添加收货地址</h3>
            <form id="address-form" class="profile-form">
                <input type="hidden" id="address-id" name="id">
                <div class="form-group">
                    <label for="address-name">收货人姓名</label>
                    <input type="text" id="address-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="address-phone">手机号码</label>
                    <input type="tel" id="address-phone" name="phone" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="address-province">省份</label>
                        <select id="address-province" name="province" required>
                            <option value="">请选择省份</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="address-city">城市</label>
                        <select id="address-city" name="city" required>
                            <option value="">请选择城市</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="address-detail">详细地址</label>
                    <input type="text" id="address-detail" name="detail" required>
                </div>
                <div class="form-group">
                    <label for="address-postal">邮政编码</label>
                    <input type="text" id="address-postal" name="postalCode">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="address-default" name="isDefault">
                        <span>设为默认地址</span>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">保存地址</button>
                    <button type="button" class="btn-secondary" id="cancel-address">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 修改密码模态框 -->
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>修改密码</h3>
            <form id="password-form" class="profile-form">
                <div class="form-group">
                    <label for="current-password">当前密码</label>
                    <input type="password" id="current-password" name="currentPassword" required>
                </div>
                <div class="form-group">
                    <label for="new-password">新密码</label>
                    <input type="password" id="new-password" name="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">确认新密码</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">确认修改</button>
                    <button type="button" class="btn-secondary" id="cancel-password">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化用户资料管理器
            if (window.ProfileManager) {
                const profileManager = new ProfileManager();
                profileManager.init();
            }

            // 绑定菜单切换事件
            const menuLinks = document.querySelectorAll('.profile-menu a');
            const sections = document.querySelectorAll('.profile-section');

            menuLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // 移除所有激活状态
                    menuLinks.forEach(l => l.classList.remove('active'));
                    sections.forEach(s => s.classList.remove('active'));
                    
                    // 添加当前激活状态
                    this.classList.add('active');
                    const targetId = this.getAttribute('href').substring(1);
                    document.getElementById(targetId).classList.add('active');
                });
            });
        });
    </script>
    <!-- 统一导航交互（P3）：移动菜单开关 + header 滚动阴影。
         旧 .navbar 为静态文档流无移动菜单，此脚本随新模板引入 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');

            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', function() {
                    const isOpen = mobileMenu.classList.toggle('open');
                    mobileMenuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                });
            }

            const header = document.getElementById('siteHeader');
            if (header) {
                let ticking = false;
                window.addEventListener('scroll', function() {
                    if (!ticking) {
                        requestAnimationFrame(function() {
                            header.classList.toggle('scrolled', window.scrollY > 50);
                            ticking = false;
                        });
                        ticking = true;
                    }
                });
            }
        });
    </script>
</body>
</html>
