<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 国际挑剔用户批 A 档 15（极简诚实级）：收复颜色主权——Chrome 自动加深把糖果色重绘得斑驳，整站明示 light -->
    <meta name="color-scheme" content="light">
    <title>商品详情 — Reich</title>
    <meta name="description" content="Reich 单品详情——规格、材质、五金一目了然，慢慢看，不着急。">
    <!-- 权益批 A1（品牌 P1-1/P1-3b 防御）：演示站全站 noindex——七页同改（PDP 静态层；
         product.js applySeo 运行时注入处同口径） -->
    <meta name="robots" content="noindex, nofollow">

    <!-- M5(修 OG 假域名)：静态层不带任何假域名 og:url/og:image；per-product 的
         og:title/og:image/og:url/canonical/JSON-LD 由 product.js 按运行时真实
         origin + 商品数据注入（绝对地址、真图路径） -->
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="Reich">
    <meta property="og:locale" content="zh_CN">
    <!-- 极客批 A 档 3：twitter property→name（与 index/orders 同批） -->
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preload" href="fonts/barlow-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components/site-header.css">
    <link rel="stylesheet" href="css/main.css">
    <!-- M5：PDP 专属样式（≤8KB gz 预算） -->
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/components/cart.css">
    <!-- 批二(8) 大师会诊栅格 P1-1：PDP 接入 Tailwind 容器（与六页同源同层叠位——
         .container/.mx-auto/.px-4 工具类生效，1280 容器+16 内边距，1440 轴线归 96；
         原 main.css .container ≥1280 档 padding 32px 叠边距随工具类层叠自然退位） -->
    <link rel="stylesheet" href="css/tailwind-entry.css">
</head>

<body class="text-[var(--text-primary)]" style="padding-top: 72px">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-[var(--ink)] text-white px-4 py-2 rounded z-50">跳转到主内容</a>

    <!-- 统一站点导航（批二(11) 大师会诊 IA P2-1：PDP 独立 PAGE_CONFIG——
         navCurrent/mobileCurrent=手袋（面包屑"手袋/品名"与主导航互证），
         移动菜单不再错标"首页"；批一(1)：搜索钮全站化后本页搜索条由
         site-header.js 同构渲染，搜索钮为活钮） -->
    <noscript>
      <header class="site-header" id="siteHeader">
        <div class="container mx-auto px-4 site-header-inner">
        <nav aria-label="主导航">
          <ul class="site-nav">
            <li><a href="#featured-collections">手袋</a></li>
            <li><a href="#brand-story">品牌故事</a></li>
            <li><a href="orders.html">订单</a></li>
          </ul>
        </nav>
        <a href="index.html" class="site-brand">REICH</a>
        <div class="site-tools">
          <a href="login.html" aria-label="用户登录" class="site-user-btn">登录</a>
          <a href="orders.html" aria-label="我的订单">订单</a>
        </div>
        </div>
      </header>
    </noscript>
    <template data-site-header data-page="product"></template>
    <script type="module" src="js/site-header.js"></script>

    <!-- 主内容：商品详情（js/product.js 按 ?id= 渲染；三路异常落页内诚实空态，不伪 404） -->
    <main id="main-content" role="main">
        <div class="product-detail container mx-auto px-4" data-product-detail>
            <!-- 渲染前占位（aria-busy）：JS 关闭/接口极慢时页面不空场 -->
            <div class="pdp-loading" aria-busy="true">
                <p>正在把这只包从店里请出来…</p>
            </div>
        </div>
    </main>

    <!-- 移动端吸底加购条（product.js 渲染，product.css ≤1023px 显示） -->

    <!-- 批二(9) 大师会诊栅格 P1-2：PDP 四栏 footer（与 index/orders 同款结构，
         商品页语境导航适配——"手袋"回商品区锚点；"退换与售后"活链同名词；
         底部收尾 padding 144→108 见 product.css .product-detail） -->
    <footer class="bg-white py-16 mt-16" role="contentinfo">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-12">
                <!-- 品牌信息 -->
                <div>
                    <h3 class="text-2xl font-semibold tracking-[0.18em] mb-6">REICH</h3>
                    <p class="mb-6 leading-[var(--leading-relaxed)]">慢慢挑，不着急——好东西都在店里等你。</p>
                    <p class="text-sm text-[var(--ink-soft)]">@REICH（即将开张）</p>
                </div>

                <!-- 快速导航（商品页语境：手袋回商品区锚点居首） -->
                <div>
                    <h4 class="text-lg font-medium mb-6">快速导航</h4>
                    <nav aria-label="快速导航链接">
                        <ul class="space-y-3">
                            <li><a href="index.html#featured-collections" class="hover:text-[var(--candy-blush-ink)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">手袋</a></li>
                            <li><a href="index.html" class="hover:text-[var(--candy-blush-ink)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">首页</a></li>
                            <li><a href="orders.html" class="hover:text-[var(--candy-blush-ink)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">我的订单</a></li>
                            <li><a href="profile.html" class="hover:text-[var(--candy-blush-ink)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">个人中心</a></li>
                            <li><a href="returns.html" class="hover:text-[var(--candy-blush-ink)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">退换与售后</a></li>
                        </ul>
                    </nav>
                </div>

                <!-- 客户服务（P5 口径：未开通项降为纯文字；B10 流程体验官终版裁决：
                     去列表样式改纯说明文字，真链接保下划线+text-secondary 与纯文字灰区分） -->
                <div>
                    <h4 class="text-lg font-medium mb-6">客户服务</h4>
                    <div class="space-y-3 text-sm leading-relaxed" aria-label="客户服务（演示站未开通）">
                        <p class="text-[var(--ink-soft)]">联系我们</p>
                        <p class="text-[var(--ink-soft)]">配送信息</p>
                        <p><a href="returns.html" class="text-secondary underline underline-offset-4 hover:text-[var(--candy-blush-ink)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">退换与售后</a></p>
                        <p class="text-[var(--ink-soft)]">常见问题</p>
                    </div>
                </div>

                <!-- 法律信息（P5：同上，降为纯文字；B10：同去列表样式） -->
                <div>
                    <h4 class="text-lg font-medium mb-6">法律信息</h4>
                    <div class="space-y-3 text-sm leading-relaxed" aria-label="法律信息（演示站未开通）">
                        <a href="privacy.html" class="block underline decoration-[var(--line-strong)] underline-offset-4 hover:text-[var(--candy-blush-ink)] focus:outline-none focus:ring-2 focus:ring-[var(--candy-blush-ink)] rounded">隐私政策</a><!-- ⑥审批1⑫：privacy.html实存,死文本激活为真链 -->
                        <p class="text-[var(--ink-soft)]">使用条款</p>
                        <p class="text-[var(--ink-soft)]">Cookie政策</p>
                        <p class="text-[var(--ink-soft)]">知识产权</p>
                    </div>
                </div>
            </div>

            <div class="mt-12 pt-8 border-t border-[var(--border-default)] text-center">
                <p>&copy; 2026 Reich. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/utils/escape-html.js"></script>
    <script type="module" defer src="js/product.js"></script>
    <!-- 批一(3)：wishlist.js 全站绑定 .reich-heart-pill——PDP ATC 旁收藏心形生效 -->
    <script type="module" defer src="js/wishlist.js"></script>
    <script type="module" defer src="js/cart.js"></script>
</body>

</html>
