<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reich - 用户登录 | 奢华购物体验</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 安全防护 -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
    <!-- X-Content-Type-Options/X-Frame-Options/X-XSS-Protection 三个安全 meta 已删:
         经 meta http-equiv 无效(浏览器只认 HTTP 响应头, X-XSS-Protection 且已废弃),
         真实响应头随 F4 login CSP 收紧一并做, 见 docs/BACKLOG.md -->
    
    <!-- 样式表 -->
    <link rel="preload" href="fonts/barlow-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components/site-header.css">
    <link rel="stylesheet" href="css/components/nav-underline.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/luxury-components.css">
    <link rel="stylesheet" href="css/components/login.css">
    <link rel="stylesheet" href="css/responsive/enhanced-responsive.css">
    
    <!-- Tailwind CSS（F3：CDN 摘除，本地构建入口——位置保持原 CDN script 行位，层叠顺序不变；
         CSP 同步收紧：script-src 不再授权外部 CDN 域） -->
    <link rel="stylesheet" href="css/tailwind-entry.css">
</head>

<body style="padding-top: 72px">
    <!-- 统一站点导航（P3 → F4 归一：js/site-header.js 单一 ES module 按 PAGE_CONFIG=login
         渲染+移动菜单，行为（开合/滚动阴影）也归一于该模块；noscript 静态头部兜底） -->
    <noscript>
      <header class="site-header" id="siteHeader">
        <nav aria-label="主导航">
          <ul class="site-nav">
            <li><a href="index.html">女士</a></li>
            <li><a href="index.html">男士</a></li>
            <li><a href="index.html">配饰</a></li>
          </ul>
        </nav>
        <a href="index.html" class="site-brand">REICH</a>
        <div class="site-tools">
          <a href="login.html" aria-label="账户" aria-current="page" class="site-user-btn">账户</a>
        </div>
      </header>
    </noscript>
    <template data-site-header data-page="login"></template>
    <script type="module" src="js/site-header.js"></script>
    <!-- 移动菜单（id=mobileMenu 冻结契约；F4 归一由 site-header.js 紧跟 header 插入） -->

    <!-- 主要内容 -->
    <main class="login-container">
        <div class="container mx-auto px-4 py-12">
            <div class="max-w-md mx-auto">
                <!-- 安全提示 -->
                <div id="security-notice" class="security-notice hidden">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/></svg>
                    <span>为了您的账户安全，请在5次登录失败后等待15分钟</span>
                </div>

                <!-- 登录卡片 -->
                <div class="login-card p-8">
                    <!-- 标题 -->
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-bold text-primary mb-2">欢迎回来</h1>
                        <p class="text-gray-600">登录您的Reich账户，享受专属服务</p>
                    </div>

                    <!-- 认证标签 -->
                    <div class="auth-tabs flex mb-6" role="tablist" aria-label="登录注册选项">
                        <button id="login-tab" class="auth-tab active flex-1 py-3 text-center font-medium" 
                                role="tab" aria-selected="true" aria-controls="login-form-container">
                            账户登录
                        </button>
                        <button id="register-tab" class="auth-tab flex-1 py-3 text-center font-medium"
                                role="tab" aria-selected="false" aria-controls="register-form-container">
                            注册账户
                        </button>
                    </div>

                    <!-- 登录表单 -->
                    <div id="login-form-container" role="tabpanel" aria-labelledby="login-tab">
                        <form id="login-form" class="space-y-6" novalidate aria-label="用户登录表单">
                            <input type="hidden" name="_token" id="csrf-token">
                            
                            <!-- 邮箱输入 -->
                            <div>
                                <label for="login-email" class="form-label">邮箱地址</label>
                                <input 
                                    type="email" 
                                    id="login-email" 
                                    name="email"
                                    class="form-input" 
                                    placeholder="请输入您的邮箱"
                                    required
                                    autocomplete="email"
                                    aria-describedby="login-email-help"
                                >
                                <div id="login-email-help" class="sr-only">请输入有效的邮箱地址用于登录</div>
                                <div id="login-email-error" class="invalid-feedback"></div>
                            </div>

                            <!-- 密码输入 -->
                            <div>
                                <label for="login-password" class="form-label">密码</label>
                                <div class="relative">
                                    <input 
                                        type="password" 
                                        id="login-password" 
                                        name="password"
                                        class="form-input pr-12" 
                                        placeholder="请输入您的密码"
                                        required
                                        autocomplete="current-password"
                                        aria-describedby="login-password-help"
                                        minlength="6"
                                    >
                                    <div id="login-password-help" class="sr-only">请输入您的登录密码</div>
                                    <button 
                                        type="button" 
                                        id="toggle-login-password"
                                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                        aria-label="显示/隐藏密码"
                                    >
                                        <svg class="pw-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/><path class="pw-eye-slash" d="M5 19 19 5"/></svg>
                                    </button>
                                </div>
                                <div id="login-password-error" class="invalid-feedback"></div>
                            </div>

                            <!-- 验证码容器 -->
                            <div id="captcha-container" class="hidden">
                                <label for="captcha-input" class="form-label">验证码 *</label>
                                <div class="captcha-container">
                                    <!-- 验证码将通过JavaScript动态生成 -->
                                </div>
                            </div>
                            
                            <!-- 记住我和忘记密码 -->
                            <div class="flex items-center justify-between">
                                <label class="flex items-center">
                                    <input type="checkbox" id="remember-me" class="mr-2">
                                    <span class="text-sm text-gray-600">记住我</span>
                                </label>
                                <!-- P5：原占位死链（井号空锚），无对应页面，改为纯文字 -->
                                <span class="text-sm text-secondary">忘记密码？（演示站暂未开通找回）</span>
                            </div>

                            <!-- 登录按钮 -->
                            <button type="submit" class="btn-luxury btn-primary w-full">
                                <svg class="mr-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/><path d="M3 12h12"/><path d="m11 7 5 5-5 5"/></svg>
                                登录
                            </button>
                        </form>

                        <!-- 社交登录 -->
                        <div class="mt-6">
                            <div class="relative">
                                <div class="absolute inset-0 flex items-center">
                                    <div class="w-full border-t border-gray-300"></div>
                                </div>
                                <div class="relative flex justify-center text-sm">
                                    <span class="px-2 bg-white text-gray-500">或使用以下方式登录</span>
                                </div>
                            </div>

                            <div class="mt-6 space-y-3">
                                <!-- P5：原井号空锚 a 标签改为 button（.social-btn 由 login-utils.js 按类名绑定点击跳转 OAuth） -->
                                <button type="button" id="casdoor-login" class="social-btn w-full">
                                    <svg class="text-blue-600" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/></svg>
                                    <span>Casdoor 统一登录</span>
                                </button>
                                <!-- Google/GitHub 社交登录按钮已移除：对应 OAuth 通道未开通，
                                     保留只会产生死入口（F5-min 诚实 UI）。Casdoor 按钮保留。 -->
                            </div>
                        </div>
                    </div>

                    <!-- 注册表单 -->
                    <div id="register-form-container" class="hidden" role="tabpanel" aria-labelledby="register-tab">
                        <form id="register-form" class="space-y-6" novalidate aria-label="用户注册表单">
                            <input type="hidden" name="_token" id="register-csrf-token">
                            
                            <div>
                                <label for="register-username" class="form-label">用户名</label>
                                <input 
                                    type="text" 
                                    id="register-username" 
                                    name="username"
                                    class="form-input" 
                                    placeholder="请输入用户名（3-20个字符）"
                                    required
                                    minlength="3"
                                    maxlength="20"
                                    aria-describedby="register-username-help"
                                    pattern="^[a-zA-Z0-9_]{3,20}$"
                                >
                                <div id="register-username-help" class="sr-only">用户名长度3-20个字符，支持字母、数字、下划线</div>
                                <div id="register-username-error" class="invalid-feedback"></div>
                            </div>

                            <div>
                                <label for="register-email" class="form-label">邮箱地址</label>
                                <input 
                                    type="email" 
                                    id="register-email" 
                                    name="email"
                                    class="form-input" 
                                    placeholder="请输入您的邮箱"
                                    required
                                    aria-describedby="register-email-help"
                                >
                                <div id="register-email-help" class="sr-only">请输入有效的邮箱地址用于注册</div>
                                <div id="register-email-error" class="invalid-feedback"></div>
                            </div>

                            <div>
                                <label for="register-password" class="form-label">密码</label>
                                <div class="relative">
                                    <input 
                                        type="password" 
                                        id="register-password" 
                                        name="password"
                                        class="form-input pr-12" 
                                        placeholder="请输入密码（至少8位）"
                                        required
                                        minlength="8"
                                        aria-describedby="register-password-help"
                                        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                                    >
                                    <div id="register-password-help" class="sr-only">密码至少8位，建议包含大小写字母、数字和特殊字符</div>
                                    <button 
                                        type="button" 
                                        id="toggle-register-password"
                                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                        aria-label="显示/隐藏密码"
                                    >
                                        <svg class="pw-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/><path class="pw-eye-slash" d="M5 19 19 5"/></svg>
                                    </button>
                                </div>
                                <div id="register-password-error" class="invalid-feedback"></div>
                                <!-- 密码强度指示器 -->
                                <div id="password-strength" class="mt-2 hidden">
                                    <div class="text-xs text-gray-600 mb-1">密码强度：</div>
                                    <div class="flex space-x-1">
                                        <div class="strength-bar flex-1 h-1 bg-gray-200 rounded"></div>
                                        <div class="strength-bar flex-1 h-1 bg-gray-200 rounded"></div>
                                        <div class="strength-bar flex-1 h-1 bg-gray-200 rounded"></div>
                                        <div class="strength-bar flex-1 h-1 bg-gray-200 rounded"></div>
                                    </div>
                                    <div id="password-strength-text" class="text-xs mt-1"></div>
                                </div>
                            </div>

                            <div>
                                <label for="confirm-password" class="form-label">确认密码</label>
                                <input 
                                    type="password" 
                                    id="confirm-password" 
                                    name="confirmPassword"
                                    class="form-input" 
                                    placeholder="请再次输入密码"
                                    required
                                    aria-describedby="confirm-password-help"
                                >
                                <div id="confirm-password-help" class="sr-only">请再次输入密码以确认</div>
                                <div id="confirm-password-error" class="invalid-feedback"></div>
                            </div>

                            <div>
                                <label class="flex items-start">
                                    <input type="checkbox" id="agree-terms" class="mt-1 mr-2" required 
                                           aria-describedby="terms-description">
                                    <span id="terms-description" class="text-sm text-gray-600">
                                        <!-- P5：/terms /privacy 演示站未开通，链接降为纯文字 -->
                                        我已阅读并同意
                                        <span class="text-secondary">服务条款</span>
                                        和
                                        <span class="text-secondary">隐私政策</span>
                                    </span>
                                </label>
                                <div id="terms-error" class="invalid-feedback" role="alert" aria-live="polite"></div>
                            </div>

                            <button type="submit" class="btn-luxury btn-primary w-full">
                                <svg class="mr-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 21c0-3.9 3.1-6 7-6 1.2 0 2.3.2 3.3.7"/><path d="M18 9h4"/><path d="M20 7v4"/></svg>
                                注册账户
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 返回首页 -->
                <div class="text-center mt-6">
                    <a href="index.html" class="text-gray-600 hover:text-primary transition-colors">
                        <svg class="mr-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                        返回首页
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 通知容器 -->
    <div id="notification-container"></div>

    <!-- JavaScript -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/advanced-email-verifier.js"></script>
    <script src="js/login-utils.js"></script>
    <script src="js/login-enhanced.js"></script>
    <script src="js/email-verification.js"></script>
    <script src="js/oauth-handler.js"></script>
    
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化CSRF令牌
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
            if (csrfToken) {
                document.getElementById('csrf-token').value = csrfToken;
                document.getElementById('register-csrf-token').value = csrfToken;
            }

            // 初始化工具函数
            LoginUtils.initPasswordToggle();
            LoginUtils.initTabSwitching();
            LoginUtils.initRealTimeValidation();
            
            // 初始化OAuth处理器
            if (typeof OAuthHandler !== 'undefined') {
                new OAuthHandler();
            }
            
            // 初始化邮箱验证
            if (typeof EmailVerification !== 'undefined') {
                new EmailVerification();
            }

            // 为表单添加无障碍访问支持
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.setAttribute('novalidate', 'true');
                
                // 为必填字段添加aria-required
                const requiredFields = form.querySelectorAll('[required]');
                requiredFields.forEach(field => {
                    field.setAttribute('aria-required', 'true');
                });
            });

            // 键盘导航支持
            document.addEventListener('keydown', function(e) {
                // ESC键关闭通知
                if (e.key === 'Escape') {
                    const notifications = document.querySelectorAll('.notification.show');
                    notifications.forEach(notification => notification.remove());
                }
            });
        });
    </script>
    <!-- 统一导航交互（P3 → F4 归一）：移动菜单开关 + header 滚动阴影
         已迁入 js/site-header.js，原内联块删除 -->
</body>
</html>
